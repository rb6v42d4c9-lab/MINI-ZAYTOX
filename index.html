<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootShadow | Web Probes</title>
    <style>
        :root {
            --bg-color: #0f0f12;
            --card-color: #1a1a20;
            --accent: #6c5ce7;
            --accent-hover: #5641e5;
            --text-main: #e0e0e0;
            --text-muted: #94a3b8;
            --snap-color: #ff9e0f;
            --tk-color: #00f2ea;
            --play-color: #d4f43c;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 500px;
            padding: 20px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 15px;
        }

        .logo {
            font-weight: 700;
            font-size: 1.2rem;
            letter-spacing: 1px;
        }
        .logo span { color: var(--accent); }

        /* Controls */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Inputs & Toggles */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            background: var(--card-color);
            border: 2px solid transparent;
            color: white;
            border-radius: 8px;
            font-size: 1rem;
            transition: 0.3s;
            box-sizing: border-box;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--accent);
        }

        .toggles label {
            cursor: pointer;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-right: 10px;
        }
        .toggles input { margin-right: 5px; accent-color: var(--accent); }

        /* Platform Toggles */
        .platform-nav {
            display: flex;
            background: var(--card-color);
            border-radius: 12px;
            padding: 5px;
            margin-bottom: 25px;
            position: relative;
        }

        .platform-nav button {
            flex: 1;
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            border-radius: 8px;
        }

        .platform-nav button.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 2px 10px rgba(108, 92, 231, 0.3);
        }

        /* Output Area */
        .output-wrapper {
            position: relative;
            min-height: 200px;
            background: rgba(0,0,0,0.2);
            border-radius: 15px;
            padding: 20px;
            overflow: hidden;
        }

        .ghost-overlay {
            position: absolute;
            top: 5px;
            left: 5px;
            right: 5px;
            bottom: 5px;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            transition: all 0.3s ease;
            border: 1px solid rgba(255,255,255,0.05);
            pointer-events: none; /* Click area */
        }

        .line { margin-bottom: 8px; opacity: 0.8; transition: opacity 0.3s; }
        .line span { float: right; font-weight: bold; }
        
        .stamp {
            font-size: 0.9rem;
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            opacity: 0.6;
            border-top: 1px solid rgba(255,255,255,0.1);
            padding-top: 10px;
        }

        /* Loading Spinner */
        .loader {
            display: none;
            width: 24px;
            height: 24px;
            border: 2px solid #fff;
            border-top-color: transparent;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        /* Dynamic Colors */
        .mode-snap .ghost-overlay { border-color: rgba(255, 158, 15, 0.2); }
        .mode-tk .ghost-overlay { border-color: rgba(0, 242, 234, 0.2); }
        .mode-play .ghost-overlay { border-color: rgba(212, 244, 60, 0.2); }

    </style>
</head>
<body>

<div class="container">
    
    <div class="header">
        <div class="logo">Root<span>Shadow</span>_</div>
        <div class="loader" id="loader"></div>
    </div>

    <!-- Input Section -->
    <div class="controls">
        <div class="toggles">
            <label><input type="checkbox" id="check-snap" checked> SNAP</label>
            <label><input type="checkbox" id="check-tk" checked> TIKTOK</label>
            <label><input type="checkbox" id="check-play" checked> PLAY</label>
        </div>
        <input type="text" id="username" placeholder="@username" value="root_shadow_user">
    </div>

    <!-- Platform Select -->
    <div class="platform-nav">
        <button class="active" onclick="setPlatform('snap')">SNAP</button>
        <button onclick="setPlatform('tiktok')">TOK</button>
        <button onclick="setPlatform('play')">PLAY</button>
    </div>

    <!-- Data Output -->
    <div class="output-wrapper" id="outputContainer">
        <div class="ghost-overlay" id="ghostCard">
            <div>
                <div class="line">STATUS</div>
                <div class="line" style="color: var(--accent); font-size: 1.2rem;">ANALYZING</div>
                <div class="line">SOURCE</div>
